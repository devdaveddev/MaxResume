# Full stack: MongoDB + API + web UI.   docker compose up --build   ->  http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    depends_on: { mongo: { condition: service_healthy } }
    environment:
      MONGO_URL: mongodb://mongo:27017
      STORAGE: mongodb            # fail fast instead of silently using memory
      CORS_ORIGINS: http://localhost:8080
      API_KEYS: ${API_KEYS:-}      # e.g. "recruiter1:change-me"; empty disables auth
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PARSE_WORKERS: ${PARSE_WORKERS:-4}

  web:
    build:
      context: ./frontend
      args: { VITE_API_KEY: "${VITE_API_KEY:-}" }
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  mongo-data:
