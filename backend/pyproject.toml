[project]
name = "maxresume-backend"
version = "0.1.0"
description = "AI resume matching & candidate ranking API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "spacy>=3.8",
    "pymongo>=4.10",
    "en-core-web-sm",
    "python-dateutil>=2.9",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "phonenumbers>=8.13",
    "pytesseract>=0.3.10",
    "pillow>=10",
    "python-json-logger>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
